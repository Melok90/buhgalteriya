<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  
  <title>Приложение Бухгалтерия</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💳</text></svg>">

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Google Fonts: Montserrat (for clean Cyrillic display) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Apple HIG Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Mobile Shell (HIG Inset Viewport) -->
  <div class="app-container">

    <!-- Top Navigation Header -->
    <header class="app-header">
      <div class="top-bar">
        <div>
          <span class="subtitle-badge">Персональный учет</span>
          <h1 class="app-title">Бухгалтерия</h1>
        </div>
        <button id="reset-btn" class="btn-reset" title="Сбросить к исходным данным" aria-label="Сбросить к исходным данным">
          <!-- Reset icon -->
          <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          <span>Сброс</span>
        </button>
      </div>

      <!-- iOS Search Bar -->
      <div class="search-wrapper">
        <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input 
          id="search-input" 
          type="text" 
          class="search-input" 
          placeholder="Искать расход" 
          autocomplete="off"
          aria-label="Искать расход"
        />
        <button id="search-clear-btn" class="search-clear-btn hidden" aria-label="Очистить поиск" title="Очистить поиск">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Segmented Category Filters -->
      <nav id="categories-filter" class="categories-filter" aria-label="Фильтр по категориям">
        <!-- Rendered by JavaScript -->
      </nav>
    </header>

    <!-- Main Scrollable Content -->
    <main class="main-scroll-area">

      <!-- Balance Card (Option 1: Apple Executive Minimal) -->
      <section id="balance-card" class="balance-card">
        <div class="balance-card-header">
          <div class="balance-header-left">
            <span class="balance-account-dot"></span>
            <span class="balance-label">Основной счет</span>
          </div>
          <div class="balance-header-actions">
            <button id="quick-analytics-btn" class="header-analytics-btn" type="button" aria-label="Аналитика расходов" title="Аналитика расходов">
              <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z"/>
              </svg>
              <span>Аналитика</span>
            </button>
            <button id="privacy-toggle-btn" class="privacy-toggle-btn" aria-label="Скрыть или показать баланс" title="Скрыть/показать баланс">
              <svg id="privacy-icon" width="17" height="17" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="balance-amount-wrapper" id="balance-amount-trigger" role="button" tabindex="0" title="Нажмите, чтобы скрыть или показать баланс">
          <span id="balance-value" class="balance-value num-tabular">19 605 ₽</span>
        </div>

        <div class="balance-context-row">
          <div class="context-item">
            <span class="context-label" id="spending-period-label">Сентябрь</span>
            <span class="context-value num-tabular" id="total-spent-amount">0 ₽</span>
          </div>
          <div class="context-divider"></div>
          <div class="context-item">
            <span class="context-label">В день</span>
            <span class="context-value num-tabular" id="daily-avg-amount">~0 ₽</span>
          </div>
        </div>
      </section>

      <!-- Section Title & Counter -->
      <div class="section-header">
        <span class="section-title">Операции</span>
        <span id="tx-count-badge" class="tx-count-label">0 записей</span>
      </div>

      <!-- Transaction List (Inset Grouped with Swipe Actions) -->
      <div id="transactions-list" class="transactions-list">
        <!-- Rendered dynamically with Swipe-to-delete support -->
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="empty-state hidden">
        <div class="empty-icon">🔍</div>
        <div class="empty-title">Ничего не найдено</div>
        <div class="empty-subtitle">Попробуйте изменить запрос или категорию</div>
      </div>

    </main>

    <!-- Floating Action Button -->
    <div class="fab-container">
      <button id="fab-add-btn" class="fab-btn" aria-label="Добавить расход">
        <div class="fab-icon-circle">
          <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
          </svg>
        </div>
        <span>Добавить</span>
      </button>
    </div>

    <!-- Dynamic Action Toast (Undo / Edit recent transaction) -->
    <div id="action-toast" class="action-toast hidden" role="status" aria-live="polite">
      <div class="toast-content">
        <span class="toast-check-icon">✓</span>
        <span id="toast-text" class="toast-text">Операция добавлена</span>
      </div>
      <div class="toast-actions">
        <button type="button" id="toast-edit-btn" class="toast-btn toast-btn-edit">Изменить</button>
        <button type="button" id="toast-undo-btn" class="toast-btn toast-btn-undo">Отменить</button>
        <button type="button" id="toast-close-btn" class="toast-close-btn" aria-label="Закрыть">✕</button>
      </div>
    </div>

    <!-- Bottom Sheet Backdrop -->
    <div id="sheet-backdrop" class="sheet-backdrop hidden"></div>

    <!-- Bottom Sheet Dialog with Pull-to-Dismiss Handle -->
    <div id="bottom-sheet" class="bottom-sheet hidden" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div id="sheet-handle-wrapper" class="sheet-handle-wrapper" title="Потяните вниз, чтобы закрыть">
        <div class="sheet-handle"></div>
      </div>

      <div class="sheet-header sheet-header-segmented">
        <div class="sheet-type-segmented" role="tablist" aria-label="Тип операции">
          <button type="button" id="type-expense-btn" class="sheet-type-btn active" role="tab" aria-selected="true">
            <span class="sheet-type-icon expense-badge">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round">
                <line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
            </span>
            <span>Расход</span>
          </button>
          <button type="button" id="type-income-btn" class="sheet-type-btn" role="tab" aria-selected="false">
            <span class="sheet-type-icon income-badge">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
            </span>
            <span>Пополнение</span>
          </button>
        </div>
        <button id="sheet-close-btn" class="sheet-close-btn" aria-label="Закрыть шторку">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <form id="add-form" class="numpad-form" novalidate>
        <!-- Large Amount Display -->
        <div class="numpad-amount-container">
          <div class="numpad-amount-row">
            <span id="numpad-amount-value" class="numpad-amount-value num-tabular">0</span>
            <span class="numpad-currency">₽</span>
          </div>
        </div>


        <!-- Selected Category Card (Interactive row replacing crypto row) -->
        <button type="button" id="selected-category-btn" class="selected-category-card" aria-label="Выбрать категорию" aria-haspopup="dialog">
          <div class="selected-cat-left">
            <div id="selected-cat-icon-badge" class="selected-cat-icon-badge" style="--cat-bg: #30d158;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
              </svg>
            </div>
            <div class="selected-cat-info">
              <span id="selected-cat-name" class="selected-cat-name">Еда</span>
              <span id="selected-cat-subtitle" class="selected-cat-subtitle">Сегодня · 0 ₽</span>
            </div>
          </div>
          <div class="selected-cat-arrow">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
            </svg>
          </div>
        </button>

        <!-- Optional Note / Comment Input ("+ Комментарий") -->
        <div class="sheet-comment-wrapper">
          <span class="sheet-comment-plus" aria-hidden="true">+</span>
          <input 
            type="text" 
            id="sheet-comment-input" 
            class="sheet-comment-input" 
            placeholder="Комментарий" 
            maxlength="60" 
            autocomplete="off"
            aria-label="Комментарий к операции"
          />
          <button type="button" id="sheet-comment-clear-btn" class="sheet-comment-clear-btn hidden" aria-label="Очистить комментарий" tabindex="-1">
            <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>

        <!-- Calculator-like Keypad (3x4) -->
        <div class="calculator-keypad" role="group" aria-label="Цифровая клавиатура">
          <button type="button" class="calc-key" data-key="1">1</button>
          <button type="button" class="calc-key" data-key="2">2</button>
          <button type="button" class="calc-key" data-key="3">3</button>
          <button type="button" class="calc-key" data-key="4">4</button>
          <button type="button" class="calc-key" data-key="5">5</button>
          <button type="button" class="calc-key" data-key="6">6</button>
          <button type="button" class="calc-key" data-key="7">7</button>
          <button type="button" class="calc-key" data-key="8">8</button>
          <button type="button" class="calc-key" data-key="9">9</button>
          <button type="button" class="calc-key calc-key-dot" data-key=".">.</button>
          <button type="button" class="calc-key" data-key="0">0</button>
          <button type="button" class="calc-key calc-key-delete" data-key="del" aria-label="Удалить последний символ">
            <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6-7h12a1 1 0 011 1v12a1 1 0 01-1 1H9l-6-7z"/>
            </svg>
          </button>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submit-btn" class="btn-submit-tx" disabled>
          Добавить расход
        </button>

        <!-- Delete Button (Only visible in edit mode) -->
        <button type="button" id="sheet-delete-tx-btn" class="sheet-delete-tx-btn hidden">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
          <span>Удалить операцию</span>
        </button>
      </form>
    </div>

    <!-- Category Picker Modal Sheet -->
    <div id="category-picker-backdrop" class="sheet-backdrop hidden" style="z-index: 50;"></div>
    <div id="category-picker-sheet" class="bottom-sheet category-picker-sheet hidden" role="dialog" aria-modal="true" aria-labelledby="cat-picker-title" style="z-index: 60;">
      <div id="cat-picker-handle-wrapper" class="sheet-handle-wrapper" title="Потяните вниз, чтобы закрыть">
        <div class="sheet-handle"></div>
      </div>
      <div class="sheet-header">
        <h2 id="cat-picker-title" class="sheet-title">Выбор категории</h2>
        <button type="button" id="cat-picker-close-btn" class="sheet-close-btn" aria-label="Закрыть выбор категорий">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div id="cat-picker-list" class="cat-picker-list" role="radiogroup" aria-label="Список категорий">
        <!-- Rendered dynamically by JS -->
      </div>
    </div>

    <!-- Analytics Bottom Sheet -->
    <div id="analytics-backdrop" class="sheet-backdrop hidden"></div>
    <div id="analytics-sheet" class="bottom-sheet hidden" role="dialog" aria-modal="true" aria-labelledby="analytics-sheet-title">
      <div id="analytics-handle-wrapper" class="sheet-handle-wrapper" title="Потяните вниз, чтобы закрыть">
        <div class="sheet-handle"></div>
      </div>
      <div class="sheet-header">
        <h2 id="analytics-sheet-title" class="sheet-title">Аналитика расходов</h2>
        <button id="analytics-close-btn" class="sheet-close-btn" aria-label="Закрыть аналитику">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div id="analytics-body" class="analytics-sheet-body">
        <!-- Rendered dynamically by JS -->
      </div>
    </div>

  </div>

  <!-- Pure JS Script -->
  <script src="app.js" defer></script>
</body>
</html>
