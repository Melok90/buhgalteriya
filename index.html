<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  
  <title>Приложение Бухгалтерия</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💳</text></svg>">

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Google Fonts: Montserrat (for clean Cyrillic display) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Apple HIG Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Mobile Shell (HIG Inset Viewport) -->
  <div class="app-container">

    <!-- Top Navigation Header -->
    <header class="app-header">
      <div class="top-bar">
        <div>
          <span class="subtitle-badge">Персональный учет</span>
          <h1 class="app-title">Бухгалтерия</h1>
        </div>
        <button id="reset-btn" class="btn-reset" title="Сбросить к исходным данным" aria-label="Сбросить к исходным данным">
          <!-- Reset icon -->
          <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          <span>Сброс</span>
        </button>
      </div>

      <!-- iOS Search Bar -->
      <div class="search-wrapper">
        <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input 
          id="search-input" 
          type="text" 
          class="search-input" 
          placeholder="Искать расход" 
          autocomplete="off"
          aria-label="Искать расход"
        />
        <button id="search-clear-btn" class="search-clear-btn hidden" aria-label="Очистить поиск" title="Очистить поиск">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Segmented Category Filters -->
      <nav id="categories-filter" class="categories-filter" aria-label="Фильтр по категориям">
        <!-- Rendered by JavaScript -->
      </nav>
    </header>

    <!-- Main Scrollable Content -->
    <main class="main-scroll-area">

      <!-- Balance Card -->
      <section id="balance-card" class="balance-card">
        <div class="balance-card-glow"></div>
        <div class="balance-card-header">
          <span class="balance-label">Общий баланс</span>
          <div class="wallet-icon-badge">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/>
            </svg>
          </div>
        </div>

        <div id="balance-value" class="balance-value num-tabular">
          19 605 ₽
        </div>

        <div class="balance-card-footer">
          <div class="status-indicator">
            <div class="status-dot"></div>
            <span class="status-text">Доступно</span>
          </div>
          <div class="total-spent-text">
            Всего трат: <span id="total-spent-amount" class="total-spent-amount num-tabular">0 ₽</span>
          </div>
        </div>
      </section>

      <!-- Section Title & Counter -->
      <div class="section-header">
        <span class="section-title">Операции</span>
        <span id="tx-count-badge" class="tx-count-label">0 записей</span>
      </div>

      <!-- Transaction List (Inset Grouped with Swipe Actions) -->
      <div id="transactions-list" class="transactions-list">
        <!-- Rendered dynamically with Swipe-to-delete support -->
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="empty-state hidden">
        <div class="empty-icon">🔍</div>
        <div class="empty-title">Ничего не найдено</div>
        <div class="empty-subtitle">Попробуйте изменить запрос или категорию</div>
      </div>

    </main>

    <!-- Floating Action Button -->
    <div class="fab-container">
      <button id="fab-add-btn" class="fab-btn" aria-label="Добавить расход">
        <div class="fab-icon-circle">
          <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
          </svg>
        </div>
        <span>Добавить</span>
      </button>
    </div>

    <!-- Bottom Sheet Backdrop -->
    <div id="sheet-backdrop" class="sheet-backdrop hidden"></div>

    <!-- Bottom Sheet Dialog with Pull-to-Dismiss Handle -->
    <div id="bottom-sheet" class="bottom-sheet hidden" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div id="sheet-handle-wrapper" class="sheet-handle-wrapper" title="Потяните вниз, чтобы закрыть">
        <div class="sheet-handle"></div>
      </div>

      <div class="sheet-header">
        <h2 id="sheet-title" class="sheet-title">Новый расход</h2>
        <button id="sheet-close-btn" class="sheet-close-btn" aria-label="Закрыть шторку">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <form id="add-form" class="sheet-form">
        <!-- Amount Input -->
        <div class="amount-input-group">
          <div class="amount-input-row">
            <input 
              id="amount-input" 
              type="number" 
              inputmode="decimal" 
              step="any"
              placeholder="0" 
              class="amount-field num-tabular" 
              required
              aria-label="Сумма расхода в рублях"
            />
            <span class="currency-symbol">₽</span>
          </div>
          <p class="amount-hint">Введите сумму расхода</p>
        </div>

        <!-- Details Inputs -->
        <div class="form-inputs-stack">
          <input 
            id="comment-input" 
            type="text" 
            placeholder="Название (например, Продукты)" 
            class="form-text-input" 
            required
            aria-label="Название расхода"
          />
          <div class="form-row-two">
            <input 
              id="place-input" 
              type="text" 
              placeholder="Место покупки" 
              class="form-text-input"
              aria-label="Место покупки"
            />
            <input 
              id="date-input" 
              type="date" 
              class="form-text-input num-tabular"
              aria-label="Дата расхода"
            />
          </div>
        </div>

        <!-- Category Picker -->
        <div>
          <label class="field-label">Категория</label>
          <div id="category-picker" class="category-horizontal-picker" role="radiogroup">
            <!-- Rendered dynamically -->
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submit-btn" class="btn-submit-tx">
          Сохранить расход
        </button>
      </form>
    </div>

  </div>

  <!-- Pure JS Script -->
  <script src="app.js" defer></script>
</body>
</html>
